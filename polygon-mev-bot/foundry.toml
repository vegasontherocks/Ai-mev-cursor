[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib"]
test = "contracts/test"
script = "contracts/script"
cache_path = "contracts/cache"

# Polygon configuration
chain_id = 137
eth_rpc_url = "${POLYGON_RPC_URL}"
etherscan_api_key = "${POLYGONSCAN_API_KEY}"

# Optimizer settings
optimizer = true
optimizer_runs = 200
via_ir = false

# Testing
verbosity = 3
fuzz_runs = 256
fuzz_max_test_rejects = 65536

# Formatting
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
polygon = "${POLYGON_RPC_URL}"
polygon_backup = "https://polygon-rpc.com"

[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }
