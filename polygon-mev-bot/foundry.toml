[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib"]
test = "contracts/test"
script = "contracts/script"
cache_path = "contracts/cache"

# Polygon configuration
chain_id = 137
# Use a sensible public Polygon RPC by default so `forge` doesn't fail when
# POLYGON_RPC_URL is not set in the environment (CI/local dev can still
# override by setting POLYGON_RPC_URL or FOUNDRY_ETH_RPC_URL).
eth_rpc_url = "https://rpc.ankr.com/polygon"
etherscan_api_key = "${POLYGONSCAN_API_KEY}"

# Optimizer settings
optimizer = true
optimizer_runs = 200
via_ir = false

# Testing
verbosity = 3
fuzz_runs = 256
fuzz_max_test_rejects = 65536

# Formatting
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
# Primary endpoint used for forking when an explicit POLYGON_RPC_URL isn't
# provided. Developers can still override this at runtime.
polygon = "https://rpc.ankr.com/polygon"
polygon_backup = "https://polygon-rpc.com"

[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }
